[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/Bardo-DE/files"
publish = false

# The layer table in scripts/check-boundary.sh says which of these may name which.
[workspace.dependencies]
files-core = { path = "crates/files-core" }
files-model = { path = "crates/files-model" }
files-fs = { path = "crates/files-fs" }
files-trash = { path = "crates/files-trash" }
files-ops = { path = "crates/files-ops" }
files-desktop = { path = "crates/files-desktop" }
files-ui = { path = "crates/files-ui" }
# quire, pinned the desktop-wide way (.git + full rev; the tag is a comment), as temor and anyview do.
ds = { git = "https://github.com/Bardo-DE/quire.git", rev = "e19728b7ee9e369d360c646bf5e7ed559bc3d6f9" }  # e19728b7: v0.3.58
ds-blitz = { git = "https://github.com/Bardo-DE/quire.git", rev = "e19728b7ee9e369d360c646bf5e7ed559bc3d6f9" }  # e19728b7: v0.3.58
ds-settings = { git = "https://github.com/Bardo-DE/quire.git", rev = "e19728b7ee9e369d360c646bf5e7ed559bc3d6f9" }  # e19728b7: v0.3.58
ds-harness = { git = "https://github.com/Bardo-DE/quire.git", rev = "e19728b7ee9e369d360c646bf5e7ed559bc3d6f9" }  # e19728b7: v0.3.58
ds-extensions = { git = "https://github.com/Bardo-DE/quire.git", rev = "e19728b7ee9e369d360c646bf5e7ed559bc3d6f9" }  # e19728b7: v0.3.58
ds-lint = { git = "https://github.com/Bardo-DE/quire.git", rev = "e19728b7ee9e369d360c646bf5e7ed559bc3d6f9" }  # e19728b7: v0.3.58
# The desktop's portable keymap core (actions, chords, Primary per platform); files owns no keymap.
chordkit = { git = "https://github.com/Bardo-DE/chordkit.git", rev = "99eec9ddd03ee345b669fcc7954ed44590724290" }
# anyview, the desktop's viewer: Quick Look is its light tier, `anyview-peek`'s worker and card, hosted as
# mailo hosts them (headless otherwise: no media player, no D-Bus). The rev is anyview's main, which names
# the quire rev above. `anyview-core` is the vocabulary (`FilePath`), `anyview-fs` opens a path as an input.
anyview-core = { git = "https://github.com/Bardo-DE/anyview.git", rev = "3d5c3a453a866791fe691ed8fdc72a57fa62383d" }  # 3d5c3a45 (quire v0.3.58)
anyview-fs = { git = "https://github.com/Bardo-DE/anyview.git", rev = "3d5c3a453a866791fe691ed8fdc72a57fa62383d" }  # 3d5c3a45 (quire v0.3.58)
anyview-image = { git = "https://github.com/Bardo-DE/anyview.git", rev = "3d5c3a453a866791fe691ed8fdc72a57fa62383d" }  # 3d5c3a45 (quire v0.3.58)
anyview-platform = { git = "https://github.com/Bardo-DE/anyview.git", rev = "3d5c3a453a866791fe691ed8fdc72a57fa62383d" }  # 3d5c3a45 (quire v0.3.58)
anyview-peek = { git = "https://github.com/Bardo-DE/anyview.git", rev = "3d5c3a453a866791fe691ed8fdc72a57fa62383d", default-features = false }  # 3d5c3a45 (quire v0.3.58)
# Copied from quire/docs/workspace-deps.toml at the rev above.
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
# Dates in the list view, in the person's own time zone.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The binary reads the XDG user folders (user-dirs.dirs) once.
dirs = "6"
notify = "8.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# files-desktop: the only crate that names docket or porter (scripts/check-boundary.sh), as
# temor-desktop is for temor. The revs and URLs follow docket: docket fe272208 locks porter
# f406782b and prov 03c855eb (spelt without .git), the ones pinned here, and ferry e61b264 locks
# the same porter, so one of each is locked. docket-provider's `dbus` feature serves the provider: no router, no cedar. No [patch]
# is needed.
docket-provider = { git = "https://github.com/Bardo-DE/docket.git", rev = "fe272208251a7aa9528df5ebc347f3a8498aec9c", features = ["dbus"] }
docket-core = { git = "https://github.com/Bardo-DE/docket.git", rev = "fe272208251a7aa9528df5ebc347f3a8498aec9c" }
docket-manifest = { git = "https://github.com/Bardo-DE/docket.git", rev = "fe272208251a7aa9528df5ebc347f3a8498aec9c" }
docket-vocab = { git = "https://github.com/Bardo-DE/docket.git", rev = "fe272208251a7aa9528df5ebc347f3a8498aec9c" }
docket-wire = { git = "https://github.com/Bardo-DE/docket.git", rev = "fe272208251a7aa9528df5ebc347f3a8498aec9c" }
# Who may call Files' provider (intentd's unit), and the stand-in a test names for it.
docket-dbus = { git = "https://github.com/Bardo-DE/docket.git", rev = "fe272208251a7aa9528df5ebc347f3a8498aec9c" }
prov = { git = "https://github.com/Bardo-DE/prov", rev = "03c855eb4c80779522cf712075dead4a761adc4f" }
porter-core = { git = "https://github.com/Bardo-DE/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
porter-ids      = { git = "https://github.com/Bardo-DE/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
# The rows the cloud drives carry (`Details`, files-desktop only): the same porter rev as above.
porter-dbus = { git = "https://github.com/Bardo-DE/porter", rev = "f406782b90b67f62f0f14ec5e78aec8992b5d709" }
# org.quire.Storage1, the cloud drives (files-desktop only): syncd's bus vocabulary, in ferry.
ferry-bus = { git = "https://github.com/Bardo-DE/ferry", rev = "e61b2648d8c455b6b36612aece7f51a6dd5ff96c" }
# TEST TOOLING (files-desktop dev-dependency only): syncd's fake Storage1, served on a private bus.
syncd-fakes = { git = "https://github.com/Bardo-DE/ferry", rev = "e61b2648d8c455b6b36612aece7f51a6dd5ff96c" }
# The tests of files-desktop write the calls the router sends as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desktop entries and the file-type database (`ds_helpers::mime`), UI-free without its default feature.
ds-helpers = { git = "https://github.com/Bardo-DE/quire.git", rev = "e19728b7ee9e369d360c646bf5e7ed559bc3d6f9", default-features = false }  # 8760244b (v0.3.57)
tempfile = "3"
# The binary finds an app's icon file in the person's icon theme (detent's version). MIT.
freedesktop-icons = "0.4"
# The disk service's signals are read as a stream (files-desktop only).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The remembered folder views (files-fs): a TOML file the app owns, read and written as text.
toml = "1"
thiserror = "2"
# The freedesktop.org Trash (files-trash only): MIT, pure Rust on Linux.
trash = "5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

# Matching on our own enums names every variant, so adding one is a compile error wherever it
# matters. Tests may unwrap (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"

# Line tables only, as quire, sill and anyview build: backtraces keep file and line, and test
# binaries link in a fraction of the memory and disk.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Patches apply only at a workspace root, so this root repeats quire's block verbatim.
# vello and anyrender come from our forks (github.com/Bardo-DE/vello and /anyrender, branch
# quire-filters): the colour matrix filter, multi-threaded filter layers and CSS filter lists, so
# every CSS `filter` function paints on both backends. Move back to crates.io once upstream has
# them (blitz-kit docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
vello_common = { git = "https://github.com/Bardo-DE/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
vello_cpu = { git = "https://github.com/Bardo-DE/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
vello_hybrid = { git = "https://github.com/Bardo-DE/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
vello_sparse_shaders = { git = "https://github.com/Bardo-DE/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
glifo = { git = "https://github.com/Bardo-DE/vello", rev = "5c986661c9e943d26dac8e8ea7812895947722b8" }
anyrender = { git = "https://github.com/Bardo-DE/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
anyrender_vello_cpu = { git = "https://github.com/Bardo-DE/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
anyrender_vello_hybrid = { git = "https://github.com/Bardo-DE/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
wgpu_context = { git = "https://github.com/Bardo-DE/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
pixels_window_renderer = { git = "https://github.com/Bardo-DE/anyrender", rev = "03fcbe4c746d2334d3fb91e63641741f3dacc826" }
# dioxus-core 0.7.10 can spin forever in VirtualDom::wait_for_work: a task woken and then cancelled
# before it is polled (a use_resource restart) leaves an empty entry in the dirty-task queue that
# pop_task never removes. Fixed upstream in DioxusLabs/dioxus#5554 (0.8-alpha only); this fork
# (github.com/Bardo-DE/dioxus, branch quire-0.7) backports it onto 0.7.10. Remove when quire
# moves to dioxus 0.8.
dioxus-core = { git = "https://github.com/Bardo-DE/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
dioxus-core-types = { git = "https://github.com/Bardo-DE/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
generational-box = { git = "https://github.com/Bardo-DE/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond = { git = "https://github.com/Bardo-DE/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond-types = { git = "https://github.com/Bardo-DE/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }

